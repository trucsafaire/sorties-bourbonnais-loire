name: Relance automatique
# Quand une tâche automatique échoue (souvent une panne passagère d'un serveur de données),
# elle est relancée une fois, 10 minutes plus tard, sans intervention. Si la relance échoue aussi,
# l'e-mail d'échec de GitHub signale un vrai problème à corriger.
on:
  workflow_run:
    workflows:
      - "Mise à jour des sorties (DATAtourisme)"
      - "Horaires d'ouverture (OpenStreetMap)"
      - "Lieux à visiter (DATAtourisme)"
      - "Publication du site"
      - "Contrôle qualité"
      - "Agent de sécurité"
      - "Déploiement du serveur (Cloudflare Worker)"
      - "Tests mobile (iPhone Safari et Android Chrome)"
      - "Applis Android et iPhone"
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  relancer:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Attendre 10 minutes que le service se rétablisse
        run: sleep 600
      - name: Relancer les étapes en échec
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
